name: Android CI

on:
  push:
    branches: [ "main" ] # Or your default branch
  pull_request:
    branches: [ "main" ] # Or your default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11' # Or the version required by your AGP
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      # Consider caching SDK components if needed: https://github.com/android-actions/setup-android#cache

    - name: Set up Android NDK
      # This step assumes NDK is bundled with SDK or uses a specific version.
      # You might need to specify NDK version explicitly if your project requires it
      # and it's not covered by android-actions/setup-android by default.
      # Example:
      # run: echo "y" | sudo ${ANDROID_HOME}/tools/bin/sdkmanager --install "ndk;25.2.9519653" --sdk_root=${ANDROID_SDK_ROOT}
      # The NDK version should match what's in your app's build.gradle
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" --sdk_root=${ANDROID_SDK_ROOT}
        echo "NDK_PATH=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV # Make NDK path available to subsequent steps
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV


    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      working-directory: ./ # gradlew is in android/ but we run this from root

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      working-directory: ./android # Run gradle commands from the android directory

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
